plugins {
    id 'java'
    id 'application'  
}

application {
    mainClass = 'Main'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.70'
    testImplementation 'junit:junit:4.13.2'  // Pour les tests unitaires
}
